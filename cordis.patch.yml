# dsh-token-usage bundle patch.
#
# One Host row serves the statistics API and records usage passively from the
# session event feed. The Client half adds a sidebar panel and a full page.
#
# `name` must be the FULL package specifier as installed in the profile's
# node_modules: the loader imports it as a module, so a bare
# `dsh-token-usage` would not resolve. Quote the value, because a YAML scalar
# starting with `@` is parsed as a directive.
#
# Optional configuration (all keys optional):
#   dbPath           absolute path of the SQLite file
#                    default: <DSH_HOME>/token-usage/usage.db
#   recordAttempts   record model steps that returned no assistant message
#                    at all (no usage available) as "unknown" request rows
#                    default: true
- insert:
    - id: token-usage
      name: "@qiz42144-web/dsh-token-usage"
      config: {}
